server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access-json.log json_combined;
    error_log /var/log/nginx/error.log warn;

    location / {
        default_type text/plain;
        return 200 "T1.6 Nginx Monitoring Application\n";
    }

    location /ok {
        default_type text/plain;
        return 200 "OK\n";
    }

    location /not-found {
        default_type text/plain;
        return 404 "Resource Not Found\n";
    }

    location /server-error {
        default_type text/plain;
        return 500 "Internal Server Error\n";
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}

map $status $log_format_placeholder {
    default "";
}
